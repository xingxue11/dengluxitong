server:
  port: 8060

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/zldminsix?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.community.userservice.entity

jwt:
  secret: mySecretKeyForJwtTokenGeneration1234567890
  expiration: 86400

ai:
  timeout-seconds: 60
  moonshot:
    api-key: ${MOONSHOT_API_KEY:}
    base-url: https://api.moonshot.cn/v1
    model: moonshot-v1-8k
    enabled: false
  qwen:
    api-key: ${QWEN_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
    enabled: false
  zhipu:
    api-key: ${ZHIPU_API_KEY:}
    base-url: https://open.bigmodel.cn/api/paas/v4
    model: glm-4
    enabled: false
  doubao:
    api-key: 
    base-url: https://ark.cn-beijing.volces.com/api/v3
    model: doubao-seed-evolving
    enabled: false
  local:
    base-url: http://localhost:11434
    model: qwen2.5:7b
    enabled: true